# RGB Underglow (disabled — LED strip devicetree needs separate fix)
CONFIG_ZMK_RGB_UNDERGLOW=n

#Scroll Options
CONFIG_ZMK_POINTING=y

#Name
CONFIG_ZMK_KEYBOARD_NAME="Pad BT"

# Increase bluetooth power transmit
CONFIG_ZMK_EXT_POWER=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SLEEP=n

#Memory
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=1200000

# ZMK Studio
CONFIG_ZMK_STUDIO=y

# OLED config
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
